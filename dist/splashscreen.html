<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />

    <title>مَسار</title>

    <style>
        /* =========================================================
           Base
           ========================================================= */

        html,
        body,
        #root {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #090c18;
        }

        body {
            overflow: hidden;
        }

        /* =========================================================
           Startup Screen
           ========================================================= */

        #startup-screen {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(184, 138, 90, 0.07) 0%,
                    rgba(184, 138, 90, 0.025) 25%,
                    #090c18 65%
                );

            color: #f2f1ec;

            overflow: hidden;
        }

        .startup-content {
            display: flex;
            flex-direction: column;
            align-items: center;

            animation: startup-appear 0.8s ease-out;
        }

        /* =========================================================
           Logo / Emblem
           ========================================================= */

        .startup-mark {
            position: relative;

            width: 82px;
            height: 82px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(184, 138, 90, 0.45);
            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(184, 138, 90, 0.12),
                    rgba(184, 138, 90, 0.025)
                );

            box-shadow:
                0 0 35px rgba(184, 138, 90, 0.08),
                inset 0 0 25px rgba(184, 138, 90, 0.04);

            animation: startup-float 3s ease-in-out infinite;
        }

        .startup-mark::before {
            content: "";

            position: absolute;
            inset: -8px;

            border: 1px solid rgba(184, 138, 90, 0.08);
            border-radius: 26px;

            animation: startup-pulse 2.5s ease-in-out infinite;
        }

        .startup-mark-inner {
            color: #b88a5a;

            font-family: "Amiri", "Times New Roman", serif;
            font-size: 42px;
            font-weight: 700;

            line-height: 1;

            text-shadow:
                0 0 18px rgba(184, 138, 90, 0.25);
        }

        /* =========================================================
           Application Title
           ========================================================= */

        .startup-title {
            margin-top: 28px;

            font-family: "Cairo", sans-serif;
            font-size: 30px;
            font-weight: 600;

            letter-spacing: 1px;

            color: #f2f1ec;

            animation: startup-title 0.8s ease-out;
        }

        .startup-subtitle {
            margin-top: 3px;

            font-family: "Cairo", sans-serif;
            font-size: 12px;

            color: rgba(242, 241, 236, 0.45);

            letter-spacing: 0.5px;
        }

        /* =========================================================
           Loading Bar
           ========================================================= */

        .startup-loader {
            position: relative;

            width: 130px;
            height: 2px;

            margin-top: 30px;

            overflow: hidden;

            background: rgba(184, 138, 90, 0.12);

            border-radius: 10px;
        }

        .startup-loader-bar {
            position: absolute;

            top: 0;
            left: -45%;

            width: 45%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                #b88a5a,
                transparent
            );

            animation:
                startup-loading 1.5s ease-in-out infinite;
        }

        /* =========================================================
           Animations
           ========================================================= */

        @keyframes startup-appear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes startup-title {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes startup-float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes startup-pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }

        @keyframes startup-loading {
            0% {
                left: -45%;
            }

            100% {
                left: 100%;
            }
        }
    </style>
</head>

<body>

        <div id="startup-screen">

            <div class="startup-content">

                <div class="startup-mark">
                    <div class="startup-mark-inner">
                        م
                    </div>
                </div>

                <div class="startup-title">
                    مَسار
                </div>

                <div class="startup-subtitle">
                    نظام متابعة الملفات
                </div>

                <div class="startup-loader">
                    <div class="startup-loader-bar"></div>
                </div>

            </div>

        </div>

</body>

</html>
